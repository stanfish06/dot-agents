id: fal
name: fal
description: >-
  fal's generative media inference platform. Submit image, video, audio, and
  text jobs to the durable queue at queue.fal.run, poll status, and fetch
  results; fal.run runs the same models synchronously. Upload input files to
  the fal CDN, read usage, billing, request history and analytics from the
  Platform APIs at api.fal.ai. Model input and output schemas, and the whole
  documentation set, are served as plain text from fal.ai with no credential.
homepage: https://fal.ai
documentation: https://docs.fal.ai
categories: [ai, ml, media]
tags: [inference, image-generation, video-generation, text-to-image, gpu, queue, flux, cdn, upload, billing, usage]
aliases: [fal-ai, fal-run, queue-fal-run]
lifecycle: active
curation: curated
sources: [manual]
provenance:
  name: { source: manual, curated: true }
  description: { source: manual, curated: true }
  categories: { source: manual, curated: true }
capabilities:
  - Read a model's exact input and output schema, pricing, and examples from fal.ai/models/<endpoint-id>/llms.txt without a credential
  - Submit an inference request to the queue under an explicit confirm rule, since every submission is billed
  - Poll request status with queue position and runner logs, and fetch the stored result
  - Cancel a queued or in-progress request under an explicit confirm rule
  - Download generated media from the fal CDN (v3b.fal.media, v3.fal.media, fal.media) by naming the origin
  - "Upload an input file to the fal CDN in two steps: initiate on `storage`, then PUT the bytes on `public`; the returned file_url is what image_url, video_url and audio_url inputs take"
  - Poll a submitted request to completion and return its result with the `await-result` workflow, no confirmation needed
  - Read usage, billing events, account billing and FOCUS reports, request history, per-endpoint analytics, and serverless logs from the Platform APIs on `platform`
profiles: [public, keyed, platform, storage]
