profile_id: pat
api_id: github
description: GitHub REST API with a personal access token in the Authorization header.
origins:
  - https://api.github.com
auth:
  type: bearer
  credential_id: github-pat
  components:
    - name: token
      description: A GitHub personal access token scoped by the user.
  placements:
    - kind: header
      header: Authorization
      template: Bearer {token}
  scopes:
    - repo
    - read:org
permissions:
  - method: GET
    path: /repos/*/*
    decision: auto
  - method: GET
    path: /repos/*/*/issues/**
    decision: auto
  - method: GET
    path: /repos/*/*/discussions
    decision: auto
    note: undocumented; absent from github/rest-api-description. Paginates with
      per_page/page; state, category, labels and sort query params are ignored
  - method: GET
    path: /repos/*/*/discussions/*
    decision: auto
    note: undocumented; single discussion by number, same shape as an issue plus
      category and answer_html_url
  - method: GET
    path: /repos/*/*/discussions/*/comments
    decision: auto
    note: undocumented; top-level comments only. Categories, reactions, timeline,
      single comment and search/discussions return 404
  - method: GET
    path: /search/**
    decision: auto
  - method: GET
    path: /user
    decision: auto
  - method: POST
    path: /repos/*/*/issues/*/comments
    decision: confirm
  - method: DELETE
    path: /**
    decision: deny
  - method: PUT
    path: /**
    decision: deny
  - method: PATCH
    path: /**
    decision: deny
network_scope: public
redirects:
  max: 3
cache:
  enabled: false
response:
  allowed_headers:
    - x-ratelimit-remaining
    - x-ratelimit-reset
health_probe:
  method: GET
  path: /rate_limit
  expect_status: 200
verification:
  state: verified
  verified_at: 2026-09-11T02:17:47.461Z
