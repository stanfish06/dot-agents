profile_id: public
api_id: fal
description: "fal's unauthenticated surfaces: model and documentation text at
  fal.ai, and the fal CDN. Fetch /models/<owner>/<app>/llms.txt for an
  endpoint's schema before submitting on `keyed`. Generated media is served from
  v3b.fal.media; pass that origin explicitly for GET /files/<...>. PUT /files/**
  is the second half of an upload: `storage` initiate returns a presigned
  upload_url on v3b.fal.media; PUT the bytes there with the `signature` query
  copied over and no Authorization header."
origins:
  - https://fal.ai
  - https://v3b.fal.media
  - https://v3.fal.media
  - https://fal.media
auth:
  type: none
permissions:
  - method: GET
    path: /llms.txt
    decision: auto
  - method: GET
    path: /docs/llms.txt
    decision: auto
  - method: GET
    path: /docs/**
    decision: auto
  - method: GET
    path: /models/**
    decision: auto
  - method: GET
    path: /files/**
    decision: auto
  - method: POST
    path: /**
    decision: deny
  - method: PUT
    path: /files/**
    decision: confirm
    note: presigned CDN upload target from storage initiate; sends the request body off-machine
  - method: PATCH
    path: /**
    decision: deny
  - method: DELETE
    path: /**
    decision: deny
network_scope: public
redirects:
  max: 2
cache:
  enabled: true
  ttl_seconds: 900
health_probe:
  method: GET
  path: /llms.txt
  expect_status: 200
verification:
  state: candidate
