profile_id: public
api_id: fal
description: "fal's unauthenticated surfaces: the agent-readable model and
  documentation text at fal.ai, and the fal CDN that serves generated media.
  Fetch /models/<owner>/<app>/llms.txt for an endpoint's current input and
  output schema before submitting a job on the `key` profile. No credential is
  required, and no Authorization header is sent to these hosts."
origins:
  - https://fal.ai
  - https://v3.fal.media
  - https://fal.media
auth:
  type: none
permissions:
  - method: GET
    path: /llms.txt
    decision: auto
  - method: GET
    path: /docs/llms.txt
    decision: auto
  - method: GET
    path: /docs/**
    decision: auto
  - method: GET
    path: /models/**
    decision: auto
  - method: GET
    path: /files/**
    decision: auto
  - method: POST
    path: /**
    decision: deny
  - method: PUT
    path: /**
    decision: deny
  - method: PATCH
    path: /**
    decision: deny
  - method: DELETE
    path: /**
    decision: deny
network_scope: public
redirects:
  max: 2
cache:
  enabled: true
  ttl_seconds: 900
health_probe:
  method: GET
  path: /llms.txt
  expect_status: 200
verification:
  state: verified
  verified_at: 2026-09-01T01:00:05.889Z
