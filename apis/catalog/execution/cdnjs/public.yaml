profile_id: public
api_id: cdnjs
description: Public cdnjs API access. No credential is required.
origins:
  - https://api.cdnjs.com
auth:
  type: none
permissions:
  - method: GET
    path: /libraries
    decision: auto
  - method: GET
    path: /libraries/*
    decision: auto
  - method: GET
    path: /libraries/*/*
    decision: auto
  - method: POST
    path: /**
    decision: deny
  - method: PUT
    path: /**
    decision: deny
  - method: PATCH
    path: /**
    decision: deny
  - method: DELETE
    path: /**
    decision: deny
network_scope: public
redirects:
  max: 2
cache:
  enabled: true
  ttl_seconds: 900
health_probe:
  method: GET
  path: /libraries
  query:
    limit: "1"
    fields: name
  expect_status: 200
