profile_id: public
api_id: docker-hub
description: Public Docker Hub Registry API access. No credential is required.
origins:
  - https://hub.docker.com
auth:
  type: none
permissions:
  - method: GET
    path: /v2/repositories/**
    decision: auto
  - method: POST
    path: /**
    decision: deny
  - method: PUT
    path: /**
    decision: deny
  - method: PATCH
    path: /**
    decision: deny
  - method: DELETE
    path: /**
    decision: deny
network_scope: public
redirects:
