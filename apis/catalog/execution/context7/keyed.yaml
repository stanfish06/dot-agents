profile_id: keyed
api_id: context7
description: "Context7 API with the key as `Authorization: Bearer <key>`. GET
  /api/v2/libs/search (libraryName, optional query) returns candidate
  libraries with ids; GET /api/v2/context (libraryId, query, type=json|txt)
  returns codeSnippets and infoSnippets. Reads run auto. POST /api/v1/refresh
  and POST /api/v2/add/* change the account's library set and use plan quota,
  so they confirm, as does PATCH /api/v2/policies. Multipart openapi-upload is
  denied. 202 means still indexing; a 301 body carries redirectUrl."
origins:
  - https://context7.com
auth:
  type: bearer
  credential_id: context7-key
  components:
    - name: token
      description: A Context7 API key from https://context7.com/dashboard. Starts
        with ctx7sk. Without it the same endpoints answer with a 200-request
        window; with it the plan's limits apply.
  placements:
    - kind: header
      header: Authorization
      template: Bearer {token}
permissions:
  - method: GET
    path: /api/v2/libs/search
    decision: auto
  - method: GET
    path: /api/v2/context
    decision: auto
  - method: GET
    path: /api/v2/libs/metrics
    decision: auto
  - method: GET
    path: /api/v2/policies
    decision: auto
  - method: POST
    path: /api/v1/refresh
    decision: confirm
    note: re-indexes a library; body is JSON with the libraryId
  - method: POST
    path: /api/v2/add/openapi-upload
    decision: deny
    note: multipart file upload, outside the supported body shapes
  - method: POST
    path: /api/v2/add/**
    decision: confirm
    note: adds a source to the account and starts indexing; 409 if it already exists
  - method: PATCH
    path: /api/v2/policies
    decision: confirm
  - method: PATCH
    path: /**
    decision: deny
  - method: PUT
    path: /**
    decision: deny
  - method: DELETE
    path: /**
    decision: deny
network_scope: public
redirects:
  max: 2
cache:
  enabled: true
  ttl_seconds: 3600
response:
  allowed_headers:
    - ratelimit-limit
    - ratelimit-remaining
    - ratelimit-reset
    - retry-after
health_probe:
  method: GET
  path: /api/v2/libs/search
  query:
    libraryName: react
  expect_status: 200
verification:
  state: candidate
